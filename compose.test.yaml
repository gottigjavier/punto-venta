# compose.test.yaml
# Punto de Venta - Stack dedicado de tests e2e
# Siempre se invoca de forma explícita con `-f compose.test.yaml`: NO se
# autodescubre (mismo criterio que podman-compose.prod.yml). Es un stack
# autocontenido con su propia base de datos descartable.

# Nombre de proyecto propio e IMPRESCINDIBLE: sin esto el proyecto se deriva del
# directorio ("punto-venta") y este stack comparte la red `punto-venta_default`
# con el stack de dev. En esa red el alias lo da el NOMBRE DE SERVICIO (`db`), no
# el `container_name`, así que hay dos contenedores peleando por `db` y la API de
# test termina hablando con la base de DESARROLLO en vez de la de test (falla con
# "database punto_venta_e2e does not exist"). Con `name:` propio la red es
# `punto-venta-e2e_default` y no hay colisión posible.
name: punto-venta-e2e

services:
  # PostgreSQL Database (descartable)
  # DB aislada y efímera: su volumen se borra con `down -v`.
  # Sin `ports:` a propósito — nada en el host se conecta a esta DB, las specs
  # son puramente HTTP y hablan con el `api`.
  db:
    image: postgres:16-alpine
    container_name: pv-database-e2e
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: punto_venta_e2e
    volumes:
      - pv-postgres-data-e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Prisma migrations (one-shot). Corre `migrate deploy` contra el `db` y
  # termina. El `api` espera a que este servicio complete con éxito
  # (idempotente: no aplica nada si la DB ya está al día).
  migrate:
    # Imagen construida con `podman build` (ver .github/workflows/ci.yml):
    # el compose nunca construye, solo orquesta.
    image: punto-venta-api-e2e
    container_name: pv-migrate-e2e
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/punto_venta_e2e
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    volumes:
      - ./prisma:/app/prisma:ro
      # Prisma 7 CLI reads prisma.config.ts to resolve datasource.url.
      # The Containerfile.dev does not COPY it (it lives at the repo root),
      # so without this mount `migrate deploy` fails with
      # "The datasource.url property is required in your Prisma config file".
      - ./prisma.config.ts:/app/prisma.config.ts:ro

  # Fastify API
  api:
    # Imagen construida con `podman build` (ver .github/workflows/ci.yml):
    # el compose nunca construye, solo orquesta.
    image: punto-venta-api-e2e
    container_name: pv-api-e2e
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/punto_venta_e2e
      - JWT_SECRET=test-jwt-secret-minimum-32-characters-long
      - JWT_REFRESH_SECRET=test-jwt-refresh-secret-minimum-32-chars
      - API_PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - RATE_LIMIT_ENABLED=false
      - MAX_LOGIN_ATTEMPTS=3
      - LOCKOUT_DURATION_MINUTES=30
      - LOG_LEVEL=debug
    # A propósito NO se define `command:` ni `volumes:`.
    #   * Sin `command:` corre el CMD de la imagen (`node dist/main.js`), es
    #     decir el código compilado, que es exactamente lo que se quiere probar.
    #   * Sin `volumes:` el stack queda autocontenido: la imagen ya trae
    #     `dist/`, `prisma/` y la CLI de prisma.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Sin servicio `client`: todas las specs e2e son API-only.

volumes:
  pv-postgres-data-e2e:
    driver: local
