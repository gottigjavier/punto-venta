# podman-compose.prod.yml
# Punto de Venta - Production Environment
# Usage: podman compose -f podman-compose.prod.yml up -d --build

services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pv-db-prod
    restart: unless-stopped
    # No port mapping in production — only accessible via internal network
    environment:
      POSTGRES_DB: punto_venta
      POSTGRES_USER: ${POSTGRES_USER:-pv_user}
      # Password de la DB tomada del secret montado en /run/secrets/db_password.
      # SOS: el primer arranque del contenedor de Postgres inicializa el rol y
      # la password desde estas variables. En un volumen persistido, el secret
      # SOLO se usa en la primera inicialización; si la cambiás, la URL del API
      # queda desincronizada hasta recrear el volumen.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pv_user} -d punto_venta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pv-network

  # ──────────────────────────────────────────────
  # Fastify API
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Containerfile
      args:
        - NODE_ENV=production
    container_name: pv-api-prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    # Construye DATABASE_URL en runtime leyendo la password del secret montado
    # en /run/secrets/db_password. La imagen del api NO expone la password en
    # vars de entorno: el entrypoint la inyecta solo en la URL de conexión.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export DATABASE_URL="postgresql://${POSTGRES_USER:-pv_user}:$(cat /run/secrets/db_password)@db:5432/punto_venta"
        && exec node dist/main.js
    environment:
      - NODE_ENV=production
      # DATABASE_URL NO se define acá: la construye el entrypoint desde el
      # secret db_password para no exponer la password en vars de entorno.
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - API_PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-5}
      - LOGIN_RATE_LIMIT_WINDOW_MS=${LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-3600000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-10}
      # API expuesta directa aquí (sin proxy delante): trustProxy deshabilitado.
      # En otro despliegue detrás de un proxy de confianza, setear los hops reales.
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      # Token bearer que protege GET /metrics (S7). Vacío en prod = 403.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-3}
      - LOCKOUT_DURATION_MINUTES=${LOCKOUT_DURATION_MINUTES:-30}
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - pv-network

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  pv-postgres-data:
    driver: local

# ──────────────────────────────────────────────
# Secrets (never hardcode passwords)
# ──────────────────────────────────────────────
secrets:
  db_password:
    file: ./secrets/db_password.txt

# ──────────────────────────────────────────────
# Internal network (services communicate here)
# ──────────────────────────────────────────────
networks:
  pv-network:
    driver: bridge
