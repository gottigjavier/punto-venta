# .github/workflows/ci.yml
# CI/CD Pipeline - Punto de Venta
# Uses Podman instead of Docker, Jujutsu for VCS

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# SC: mínimos permisos por defecto. Cada job hereda read-only y solo el job
# `build` sobreescribe con lo que realmente necesita (packages: write para
# push de imágenes, contents: write para crear la release).
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # Job 2: Unit & Integration Tests
  # ──────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: punto_venta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d punto_venta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/punto_venta_test

      - name: Run unit tests
        run: npm run test:run
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/punto_venta_test
          # TS1: obliga a que la integración DB (venta-cierre-concurrency) corra o
          # reviente. Sin esto, los tests de concurrencia se omitirían en silencio
          # si la DB no está disponible y la suite pasaría verde sin probarlos.
          REQUIRE_INTEGRATION_DB: "1"
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          API_PORT: 3001
          FRONTEND_URL: http://localhost:3000

  # ──────────────────────────────────────────────
  # Job 3: E2E Tests (with Podman)
  # ──────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Verify Podman installation
        run: podman --version

      - name: Build containers
        run: podman compose build

      - name: Start services
        run: podman compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            if podman compose ps | grep -q "healthy"; then
              echo "Services are healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        run: podman compose exec -T api npx prisma migrate deploy

      - name: Run E2E tests
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          podman compose logs api > api-logs.txt 2>&1 || true
          podman compose logs db > db-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: |
            api-logs.txt
            db-logs.txt
          if-no-files-found: error
          retention-days: 5

      - name: Shutdown services
        if: always()
        run: podman compose down -v

  # ──────────────────────────────────────────────
  # Job 4: Build & Push Container Images
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GitHub Container Registry
        # Sin template-injection: el token via env (no echo a stdout) y el actor
        # desde $GITHUB_ACTOR (automática), nunca ${{ github.actor }} en shell.
        run: podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build API image
        # Sólo se interpolan valores NO controlables por un atacante. REGISTRY e
        # IMAGE_NAME vienen del entorno del workflow (no de un input/PR); la
        # versión y el sha salen del paso `version`, no del trigger. Se pasan
        # como env del paso y se referencian con $VAR para evitar template-injection.
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          podman build \
            --file api/Containerfile \
            --tag "$REGISTRY/$IMAGE_NAME/api:$IMAGE_VERSION" \
            --tag "$REGISTRY/$IMAGE_NAME/api:latest" \
            --label "version=$IMAGE_VERSION" \
            --label "git-sha=$IMAGE_SHORT_SHA" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Push API image (versioned)
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: podman push "$REGISTRY/$IMAGE_NAME/api:$IMAGE_VERSION"

      - name: Push API image (latest)
        run: podman push "$REGISTRY/$IMAGE_NAME/api:latest"

      - name: Create GitHub Release
        # gh release es la CLI nativa del runner (sin acción de terceros).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$IMAGE_VERSION" --title "Release v$IMAGE_VERSION" --generate-notes
