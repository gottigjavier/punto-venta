# render.yaml — Blueprint para deploy del backend en Render
services:
  - type: web
    name: punto-venta-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: rm -rf node_modules/.prisma && npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://punto-venta-seven.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PORT
        # PORT es inyectado automáticamente por Render
      # Detrás del proxy de Render: confiar en 1 hop para la IP del cliente (S3)
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Token bearer que protege GET /metrics (S7). Se setea desde el dashboard
      # de Render (sync:false). Si queda vacío, /metrics devuelve 403 en prod.
      - key: METRICS_TOKEN
        sync: false
